[package]
name = "truto"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Rust SDK for the Truto REST API"
license = "MIT"
readme = "README.md"
repository = "https://github.com/trutohq/truto-rust-sdk"
homepage = "https://truto.one"
documentation = "https://docs.rs/truto"
keywords = ["truto", "api", "sdk", "unified-api", "integrations"]
categories = ["api-bindings", "web-programming::http-client"]
# Model generation inputs and CI config are for working on the SDK, not using it.
exclude = ["/spec", "/codegen", "/.github"]

[dependencies]
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
wiremock = "0.6"
