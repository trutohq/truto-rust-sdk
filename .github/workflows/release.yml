name: Release

# Push a tag like v0.2.0 (matching the version in Cargo.toml) to publish.
# crates.io auth uses Trusted Publishing (GitHub OIDC): no stored token.

on:
  push:
    tags: ['v*']

permissions:
  contents: write  # create the GitHub Release
  id-token: write  # crates.io Trusted Publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Tag matches Cargo.toml version
        id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: cargo test

      # The first version was published by hand (Trusted Publishing can only be
      # set up on an existing crate); skip publishing a version that exists.
      - name: Already on crates.io?
        id: exists
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' -A 'trutohq/truto-rust-sdk release workflow' \
            "https://crates.io/api/v1/crates/truto/${{ steps.version.outputs.version }}")
          echo "published=$([ "$status" = 200 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: rust-lang/crates-io-auth-action@v1
        if: steps.exists.outputs.published == 'false'
        id: auth

      - run: cargo publish
        if: steps.exists.outputs.published == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: GitHub release with the changelog section as notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${{ steps.version.outputs.version }}
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
